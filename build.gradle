plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'gadgetinspector'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}

// Cấu hình main class cho plugin 'application'
application {
    mainClass = 'gadgetinspector.GadgetInspector'
}

sourceSets {
    main {
        resources {
            srcDirs = ["src/main/java/gadgetinspector/resultOutput/resources"]
        }
    }
}

dependencies {
    implementation "org.ow2.asm:asm:9.6" // Nâng cấp ASM lên 9.6 để hỗ trợ Java 21 tốt hơn
    implementation "org.ow2.asm:asm-commons:9.6"
    implementation "com.google.guava:guava:32.1.3-jre" // Nâng cấp Guava
    implementation 'org.slf4j:slf4j-api:1.7.36'
    implementation 'org.slf4j:slf4j-log4j12:1.7.36'

    if (project.hasProperty("inspectGroup")) {
        implementation "${project.inspectGroup}:${project.inspectName}:${project.inspectVersion}"
    }
}

jar {
    manifest {
        attributes(
                'Main-Class': 'gadgetinspector.GadgetInspector'
        )
    }
    // Đảm bảo include resources
    from sourceSets.main.output
}

// Giữ lại logic của task runInspect
if (project.hasProperty("inspectConfig")) {
    tasks.register('runInspect', JavaExec) {
        classpath = sourceSets.main.runtimeClasspath
        mainClass = "gadgetinspector.GadgetInspector"
        args = ["--config", project.inspectConfig]
    }
}
