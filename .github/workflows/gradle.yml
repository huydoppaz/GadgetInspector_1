name: Java CI with Gradle

on:
  push:
    branches: ["**"] # Chạy mỗi khi push lên bất kỳ branch nào

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # Bước quan trọng: Cấp quyền chạy cho file gradlew ngay trong workflow
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle Wrapper
      run: ./gradlew build

    # Lưu trữ file JAR sau khi build thành công
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: java-app-jar
        path: build/libs/*.jar
